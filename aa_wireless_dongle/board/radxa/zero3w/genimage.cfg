image boot.vfat {
	vfat {
		label = "WirelessAA"
		files = {
			"aawgd.conf",
			"Image",
			"rk3566-radxa-zero-3w-aic8800d80.dtb",
		}
		file extlinux/extlinux.conf {
			image = "extlinux.conf"
		}
	}

	size = 64M
}

image persist.ext4 {
	name = "persist"
	ext4 {
		label = "persist"
		use-mke2fs = true
	}
	size = 32M
}

image sdcard.img {
	hdimage {
	}

	# The RK3566 boot ROM loads the packed bootloader from sector 64
	partition u-boot {
		in-partition-table = "false"
		image = "u-boot-rockchip.bin"
		offset = 32K
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 16M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition persist {
		partition-type = 0x83
		image = "persist.ext4"
	}
}
