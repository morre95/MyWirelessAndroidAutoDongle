
######## USB accessory hardware test (#9). Never ship this block. ########
## Appended to a copy of aawgd.conf on a test card's WirelessAA partition.
## rcS sources this file before the init scripts run, with /persist mounted.

## Usb first: aawgd binds the default gadget without waiting for Wi-Fi.
AAWG_CONNECTION_STRATEGY=2

## Record uevents, the kernel log, syslog and UDC/gadget state in /persist.
## The OTG port is also the power input, so unplugging cuts power: sync often.
if [ -z "$AAWG_USB_TEST_STARTED" ]; then
	AAWG_USB_TEST_STARTED=1
	mkdir -p /persist/usb-test
	usb_test_boot=$(( $(cat /persist/usb-test/count 2>/dev/null || echo 0) + 1 ))
	echo "$usb_test_boot" > /persist/usb-test/count
	usb_test_dir=/persist/usb-test/boot-$usb_test_boot
	mkdir -p "$usb_test_dir"
	uevent sh -c 'env | grep -E "^(SEQNUM|ACTION|SUBSYSTEM|DEVPATH|DEVNAME|DEVTYPE|DRIVER|ACCESSORY|USB_STATE)="; echo' \
		>> "$usb_test_dir/uevents.txt" 2>&1 &
	(
		i=0
		while [ $i -lt 40 ]; do
			sleep 15
			dmesg > "$usb_test_dir/dmesg.txt"
			cp /var/log/messages "$usb_test_dir/messages.txt"
			for udc in /sys/class/udc/*; do
				echo "$udc state=$(cat "$udc/state") speed=$(cat "$udc/current_speed")"
			done > "$usb_test_dir/udc.txt"
			for gadget in /sys/kernel/config/usb_gadget/*; do
				echo "$gadget UDC=$(cat "$gadget/UDC")"
			done > "$usb_test_dir/gadgets.txt"
			sync
			i=$((i + 1))
		done
	) &
fi
