
######## AIC firmware smoke test (#11). Never ship this block. ########
## Appended to a copy of aawgd.conf on a test card's WirelessAA partition.
## rcS sources this file before the init scripts run, with /persist mounted.

## Load the BSP, then fdrv, synchronously and record whether the firmware
## uploads succeed and wlan0 appears. Loading waits until rcS has finished,
## so S40network has already given up on wlan0 and starts no access point.
if [ -z "$AAWG_AIC_TEST_STARTED" ]; then
	AAWG_AIC_TEST_STARTED=1
	mkdir -p /persist/aic-test
	aic_test_boot=$(( $(cat /persist/aic-test/count 2>/dev/null || echo 0) + 1 ))
	echo "$aic_test_boot" > /persist/aic-test/count
	aic_test_dir=/persist/aic-test/boot-$aic_test_boot
	mkdir -p "$aic_test_dir"
	(
		sleep 60
		{
			echo "uptime before: $(cut -d' ' -f1 /proc/uptime)"
			modprobe aic8800_bsp; echo "modprobe aic8800_bsp: $?"
			modprobe aic8800_fdrv; echo "modprobe aic8800_fdrv: $?"
			echo "uptime after: $(cut -d' ' -f1 /proc/uptime)"
		} > "$aic_test_dir/load.txt" 2>&1
		sleep 30
		dmesg > "$aic_test_dir/dmesg.txt"
		cp /var/log/messages "$aic_test_dir/messages.txt"
		{
			lsmod
			echo
			ls -l /sys/class/net
			echo
			iw dev
			echo
			iw list
		} > "$aic_test_dir/radio.txt" 2>&1
		sync
	) &
fi
