######## Radio startup test (#12). Never ship this block. ########
## Appended to a copy of aawgd.conf on a test card's WirelessAA partition.
## rcS sources this file before the init scripts run, with /persist mounted.
## The card copy also sets AAWG_WIFI_PASSWORD, which is never committed.

## SSH over the dongle's Wi-Fi, for capturing the boot log.
AAWG_ENABLE_SSH=1

## Record this boot's radio, pairing and accessory state to persist 2 and
## 10 minutes after boot, in case SSH is not reachable.
if [ -z "$AAWG_RADIO_TEST_STARTED" ]; then
	AAWG_RADIO_TEST_STARTED=1
	mkdir -p /persist/radio-test
	radio_test_boot=$(( $(cat /persist/radio-test/count 2>/dev/null || echo 0) + 1 ))
	echo "$radio_test_boot" > /persist/radio-test/count
	radio_test_dir=/persist/radio-test/boot-$radio_test_boot
	mkdir -p "$radio_test_dir"
	(
		for radio_test_at in 120 600; do
			sleep $(( radio_test_at - $(cut -d. -f1 /proc/uptime) ))
			radio_test_out=$radio_test_dir/at-$radio_test_at
			mkdir -p "$radio_test_out"
			dmesg > "$radio_test_out/dmesg.txt"
			cp /var/log/messages "$radio_test_out/messages.txt"
			cp /var/log/hostapd "$radio_test_out/hostapd.txt"
			{
				cut -d' ' -f1 /proc/uptime
				lsmod
				echo
				iw reg get
				echo
				iw dev
				echo
				iw dev wlan0 station dump
				echo
				ls /sys/class/bluetooth
				bluetoothctl show
				bluetoothctl devices Paired
				echo
				ls -l /persist/bluetooth
				echo
				cat /sys/kernel/config/usb_gadget/*/UDC
			} > "$radio_test_out/state.txt" 2>&1
			sync
		done
	) &
fi
