name: Makefile CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    # Documentation changes can't affect the image, and a full build is six
    # boards at up to ~1h40m each. Path filters are not evaluated for tag
    # pushes, so a v* tag still builds even if it only touches the files listed
    # here.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build:
    strategy:
      # One board's flaky download shouldn't throw away the four other builds
      # that are already 40 minutes in.
      fail-fast: false
      matrix:
        defconfig:
        - raspberrypi0w
        - raspberrypizero2w
        - raspberrypi4
        - raspberrypi3a
        - raspberrypi5
        - radxa-zero3w

    runs-on: ubuntu-latest

    steps:
    # The Radxa build tree needs about 14 GB, more than the runner leaves free.
    # Remove preinstalled SDKs that no build here uses.
    - name: Free disk space
      if: matrix.defconfig == 'radxa-zero3w'
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    - uses: actions/checkout@v7
      with:
        submodules: recursive

    # Buildroot re-downloads every package tarball from upstream on each run, so
    # a mirror outage kills the build long after it started. Tarballs are checked
    # against known hashes, so a warm dl/ cache is skipped straight past. The
    # run_id makes each run write a fresh cache, seeded from the previous one via
    # restore-keys, so newly added packages accumulate instead of being refetched.
    - name: Cache Buildroot downloads
      uses: actions/cache@v6
      with:
        path: ./buildroot/dl
        key: buildroot-dl-${{ matrix.defconfig }}-${{ github.run_id }}
        restore-keys: buildroot-dl-${{ matrix.defconfig }}-

    - name: Setup config
      run: make BR2_EXTERNAL=../aa_wireless_dongle/ ${{ matrix.defconfig }}_defconfig
      working-directory: ./buildroot

    - name: Build
      run: make
      working-directory: ./buildroot

    - name: Compress sdcard.img and write its checksum
      run: |
        xz -c sdcard.img > ${{ matrix.defconfig }}-sdcard.img.xz
        sha256sum ${{ matrix.defconfig }}-sdcard.img.xz > ${{ matrix.defconfig }}-sdcard.img.xz.sha256
      working-directory: ./buildroot/output/images

    - uses: actions/upload-artifact@v7
      with:
        name: WirelessAndroidAutoDongle-${{ matrix.defconfig }}
        path: |
          ./buildroot/output/images/${{ matrix.defconfig }}-sdcard.img.xz
          ./buildroot/output/images/${{ matrix.defconfig }}-sdcard.img.xz.sha256
  
  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/upload-artifact/merge@v7
        with:
          name: WirelessAndroidAutoDongle-all

  # Attach the images to a GitHub Release when a v* tag is pushed. Release
  # assets never expire and can be downloaded without a GitHub account, unlike
  # the workflow artifacts above, which are kept for 90 days and need a login.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      # The per-board artifacts only; WirelessAndroidAutoDongle-all holds the
      # same images again and would upload every file twice.
      - uses: actions/download-artifact@v7
        with:
          pattern: WirelessAndroidAutoDongle-raspberrypi*
          merge-multiple: true
          path: images

      - uses: actions/download-artifact@v7
        with:
          pattern: WirelessAndroidAutoDongle-radxa*
          merge-multiple: true
          path: images

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" images/*.img.xz images/*.sha256
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --generate-notes
